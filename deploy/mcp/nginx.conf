# Include inside nginx's http block; mount approved TLS certificates read-only.
limit_req_zone $binary_remote_addr zone=mcp_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=mcp_connections:10m;
log_format mcp '$status $request_time $upstream_response_time';
server {
    listen 443 ssl;
    server_name mcp.gyral.dev;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    client_body_timeout 10s;
    access_log /var/log/nginx/access.log mcp;
    limit_req_status 429;
    location = /mcp {
        limit_req zone=mcp_rate burst=20 nodelay;
        limit_conn mcp_connections 8;
        proxy_pass http://gyral-mcp:3000;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 15s;
    }
    location = /healthz {
        proxy_pass http://gyral-mcp:3000;
        proxy_set_header Host $http_host;
    }
    location / { return 404; }
}
