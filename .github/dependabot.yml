# Dependabot opens update PRs; it adds no Actions triggers (ADR 0004). Run `pnpm check`
# locally on a Dependabot branch before merging. Every ecosystem waits until a version is two
# weeks old (ADR 0032).
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # Groups take minor and patch bumps only: a major arrives as its own PR, so one breaking
    # bump can't hold back the safe ones.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the supported runtime major (Node 24, `engines`), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
