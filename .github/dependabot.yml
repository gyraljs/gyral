# Dependabot opens update PRs; it adds no Actions triggers (ADR 0004). Run `pnpm check`
# locally on a Dependabot branch before merging.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    ignore:
      # lit-html >= 3.3.1 leaks a comment node per removed repeat() item
      # (https://github.com/lit/lit/issues/5298); the workspace pins 3.3.0 until it's fixed.
      - dependency-name: lit-html
        versions: ['> 3.3.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
